name: Validate knowledge base

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate structure and links
        run: python ".\技能\本地记忆管理-技能\scripts\validate_memory_knowledge_base.py" --root . --portable --strict
